services:
  kindle-dashboard:
    build: .
    image: kindle-dashboard:latest
    container_name: kindle-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"  # 左側を変えれば NAS 側のポートを変更できる
    environment:
      - TZ=Asia/Tokyo
      # SwitchBot（室内の温湿度・CO2）を使う場合は .env に書く
      - SWITCHBOT_TOKEN=${SWITCHBOT_TOKEN:-}
      - SWITCHBOT_SECRET=${SWITCHBOT_SECRET:-}
      # Google カレンダーの「iCal 形式の非公開 URL」（複数ならカンマ区切り）
      - CALENDAR_ICS_URLS=${CALENDAR_ICS_URLS:-}
    volumes:
      - ./config:/config:ro  # config/config.json を置く
      # プログラムはこのフォルダから直接読む（更新はファイルを上書きして再起動するだけ。ビルド不要）
      - ./dashboard:/app/dashboard:ro
      - ./serve.py:/app/serve.py:ro
