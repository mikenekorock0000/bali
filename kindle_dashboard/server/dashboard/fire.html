<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>ダッシュボード</title>
<style>
/* Fire HD 8（1280x800 横置き）向け。幅 1024 で組み、高さは画面の縦横比に合わせて伸び縮みする
   （16:10 なら 640、Fire 7 の 1024x600 なら 600）。#stage ごと画面に合わせて拡大縮小する。
   少し離れても読めるよう、常に出すもの（時計・今の天気・室内）は大きく、
   それ以外（時間ごと・グラフ・この先・マーケット・予定）は 1 枚ずつ大きく順番に出す。 */
@font-face { font-family: "JP"; src: url("/fonts/NotoSansJP-VF.ttf"); font-weight: 100 900; font-display: swap; }
:root {
  --bg: #0a0d12; --card: #141922; --card2: #1b2230; --line: #262e3b; --text: #f4f6f9; --sub: #9aa4b3; --dim: #5d6778;
  --sun: #ffc93c; --rain: #52adff; --cloud: #b4bdca; --snow: #eaf2ff; --up: #ff6b6b; --down: #3fd69c;
  --accent: #6ea8ff; --warn: #ffb020;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
/* 背景（天気 × 朝昼夕夜）。2 枚を重ねてゆっくり入れ替える */
.bg { position: fixed; inset: 0; transition: opacity 4s; }
#bg2 { opacity: 0; }
#fx { position: fixed; inset: 0; pointer-events: none; }
#shade { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.25)); }
#fx.rain { background-image: repeating-linear-gradient(105deg, rgba(180,210,255,.0) 0 14px, rgba(180,210,255,.16) 14px 15px);
  background-size: 120px 120px; animation: rainfall .6s linear infinite; }
@keyframes rainfall { to { background-position: -32px 120px; } }
#fx.snow { background-image: radial-gradient(circle, rgba(255,255,255,.9) 0 2px, transparent 3px),
  radial-gradient(circle, rgba(255,255,255,.6) 0 1.5px, transparent 2.5px);
  background-size: 90px 90px, 55px 55px; background-position: 0 0, 20px 30px; animation: snowfall 9s linear infinite; }
@keyframes snowfall { to { background-position: 30px 360px, 0 330px; } }
#fx.stars { background-image: radial-gradient(circle, rgba(255,255,255,.85) 0 1.2px, transparent 2px),
  radial-gradient(circle, rgba(255,255,255,.5) 0 1px, transparent 1.6px);
  background-size: 140px 110px, 90px 70px; background-position: 10px 20px, 50px 5px; animation: twinkle 5s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .45; } to { opacity: .9; } }
#fx.sunny { background: radial-gradient(circle at 88% 8%, rgba(255,230,150,.45), rgba(255,230,150,0) 38%); }
#fx.dusk { background: radial-gradient(ellipse at 50% 110%, rgba(255,150,80,.35), rgba(255,150,80,0) 60%); }
body { font-family: "JP", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; -webkit-user-select: none; user-select: none; }
#stage { position: absolute; left: 0; top: 0; width: 1024px; height: 640px; transform-origin: 0 0; padding: 14px 16px;
  display: grid; grid-template-rows: 242px minmax(160px, 1fr) 150px; gap: 12px; transition: filter 2s; }
body.night #stage { filter: brightness(.45); }
.card { background: rgba(8,12,20,.5); border-radius: 18px; position: relative; overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.num { font-variant-numeric: tabular-nums; }
.hi { color: var(--up); } .lo { color: var(--rain); }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--sub); }

/* ---- 上段: 時計（左）と今の天気（右） */
#top { display: grid; grid-template-columns: 440px 1fr; gap: 14px; }
#clockbox { display: flex; flex-direction: column; justify-content: center; padding-left: 4px; }
#clockbox { text-shadow: 0 2px 14px rgba(0,0,0,.45); }
#time { font-family: "Clock", "JP", sans-serif; font-size: 122px; line-height: .92; letter-spacing: -.01em; }
#time .colon { display: inline-block; transform: translateY(-.06em); transition: opacity .3s; }
#date { font-size: 27px; font-weight: 800; color: #e3e8ef; margin-top: 2px; }
#date .sat { color: #8fc0ff; } #date .sun { color: #ff8f8f; }
/* 今日のお知らせ（ゴミ・祝日・二十四節気・雑節） */
#chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; text-shadow: none; }
#chips:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 16px; font-weight: 800; padding: 3px 11px; border-radius: 99px;
  background: rgba(8,12,20,.6); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); white-space: nowrap; }
.chip small { font-size: 11px; font-weight: 700; opacity: .8; }
.chip svg { width: 16px; height: 16px; }
.chip.gomi { background: #ffd34d; color: #1b1500; box-shadow: none; animation: pulse 2.4s ease-in-out infinite; }
.chip.gomi.later { background: rgba(255,211,77,.18); color: #ffe08a; box-shadow: inset 0 0 0 1px rgba(255,211,77,.5); animation: none; }
.chip.gomi.tomorrow { background: rgba(8,12,20,.6); color: #ffe08a; box-shadow: inset 0 0 0 2px #ffd34d; animation: none; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(255,211,77,.25); } }
.chip.hol { background: #e24b4b; box-shadow: none; }
.chip.sekki { box-shadow: none; }
.chip.zas { background: rgba(160,120,255,.25); box-shadow: inset 0 0 0 1px rgba(190,160,255,.5); }
#indoor { display: flex; gap: 10px; margin-top: 8px; text-shadow: none; }
.pill { background: rgba(8,12,20,.58); border-radius: 12px; padding: 5px 12px; display: flex; align-items: baseline; gap: 6px; }
.pill .k { font-size: 14px; color: var(--sub); font-weight: 600; }
.pill .v { font-size: 26px; font-weight: 800; }
.pill .u { font-size: 14px; color: var(--sub); }
.pill.warn { box-shadow: inset 0 0 0 2px var(--warn); }
.pill.warn .v { color: var(--warn); }

#now { display: grid; grid-template-columns: 150px 1fr; align-items: center; padding: 14px 22px 14px 14px; color: #fff;
  background: rgba(8,12,20,.32); }
#now .icon svg { width: 150px; height: 150px; display: block; }
#now .temp { font-size: 92px; font-weight: 800; line-height: .95; letter-spacing: -.02em; }
#now .temp small { font-size: 34px; font-weight: 600; opacity: .85; margin-left: 2px; }
#now .label { font-size: 28px; font-weight: 800; margin-top: 4px; }
#now .meta { display: flex; gap: 16px; font-size: 18px; font-weight: 600; margin-top: 8px; opacity: .95; }
#now .meta .hi { color: #ffd0d0; } #now .meta .lo { color: #cfe6ff; }
#now .cloth { position: absolute; right: 18px; top: 14px; font-size: 15px; font-weight: 700; background: rgba(0,0,0,.25);
  padding: 4px 12px; border-radius: 99px; max-width: 46%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#now .tip { position: absolute; right: 18px; bottom: 14px; font-size: 15px; font-weight: 800; color: #ffe08a; }

/* ---- 中段: 順番に切り替わるパネル */
#panel { padding: 0; }
#tabs { position: absolute; left: 18px; right: 18px; top: 10px; display: flex; gap: 8px; align-items: center; z-index: 2; }
#tabs .tab { font-size: 14px; font-weight: 700; color: var(--dim); padding: 2px 10px; border-radius: 99px; }
#tabs .tab.on { color: var(--bg); background: var(--accent); }
#tabs .bar { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-left: 6px; }
#tabs .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.page { position: absolute; left: 0; right: 0; top: 38px; bottom: 0; padding: 0 18px 12px; opacity: 0; display: flex; flex-direction: column; justify-content: center;
  transform: translateX(30px); transition: opacity .6s, transform .6s; }
.page.on { opacity: 1; transform: none; }
.page.out { opacity: 0; transform: translateX(-30px); }

.hours { display: grid; grid-template-columns: repeat(8, 1fr); text-align: center; height: 100%; align-items: center; }
.hours .t { font-size: 16px; color: var(--sub); font-weight: 600; line-height: 1.2; }
.hours svg { width: 42px; height: 42px; display: block; margin: 0 auto; }
.hours .tp { font-size: 26px; font-weight: 800; line-height: 1.05; }
.hours .pp { font-size: 16px; color: var(--rain); font-weight: 700; height: 20px; }
.hours .now .t { color: var(--sun); }

.chart svg { width: 100%; height: 118px; display: block; }
.page > div { flex: 1; min-height: 0; }
/* 縦に余裕のある画面（Fire HD 8 など 16:10）では中段を一回り大きく */
body.tall .hours .t { font-size: 18px; } body.tall .hours svg { width: 54px; height: 54px; }
body.tall .hours .tp { font-size: 32px; } body.tall .hours .pp { font-size: 18px; height: 24px; }
body.tall .days .d svg { width: 78px; height: 78px; } body.tall .days .d { grid-template-columns: 84px 1fr; }
body.tall .days .tt { font-size: 36px; } body.tall .days .dt { font-size: 20px; }
body.tall .quotes .pr { font-size: 40px; } body.tall .quotes .ch { font-size: 19px; }
body.tall .events .ti { font-size: 23px; } body.tall .events .e { padding: 10px 14px; }
body.tall .chart svg { height: 148px; }

.days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; height: 100%; }
.days .d { background: rgba(255,255,255,.06); border-radius: 14px; display: grid; grid-template-columns: 70px 1fr; align-items: center; padding: 6px 14px; }
.days .d svg { width: 66px; height: 66px; }
.days .dt { font-size: 18px; font-weight: 700; color: var(--sub); }
.days .dt.we { color: var(--accent); }
.days .tt { font-size: 30px; font-weight: 800; line-height: 1.15; }
.days .lb { font-size: 15px; color: var(--sub); font-weight: 600; }

.quotes { display: grid; gap: 12px; height: 100%; }
.quotes .q { background: rgba(255,255,255,.06); border-radius: 14px; padding: 8px 16px; display: flex; flex-direction: column; justify-content: center; }
.quotes .lb { font-size: 16px; font-weight: 700; color: var(--sub); }
.quotes .lb small { font-size: 12px; color: var(--dim); margin-left: 6px; font-weight: 600; }
.quotes .pr { font-size: 34px; font-weight: 800; line-height: 1.15; }
.quotes .pr small { font-size: 15px; color: var(--sub); margin-left: 2px; font-weight: 600; }
.quotes .ch { font-size: 17px; font-weight: 800; }
.quotes .ch .arrow { display: inline-block; margin-right: 2px; }

.events { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; align-content: center; height: 100%; }
.events .e { display: flex; gap: 12px; align-items: center; background: rgba(255,255,255,.06); border-radius: 12px; padding: 6px 12px; min-width: 0; }
.events .w { font-size: 14px; font-weight: 700; color: var(--sub); min-width: 74px; line-height: 1.25; }
.events .e.today .w { color: var(--sun); }
.events .ti { font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.events .e.hol .ti { color: var(--up); }

/* ---- 下段: ヘッドライン（1 本ずつ大きく） */
#news { padding: 14px 22px 12px; display: flex; flex-direction: column; }
#news .head { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: var(--sub); }
#news .badge { background: var(--up); color: #fff; font-size: 13px; padding: 2px 10px; border-radius: 6px; letter-spacing: .08em; }
#news .cnt { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }
#hl { flex: 1; position: relative; margin-top: 6px; }
#hl .item { position: absolute; inset: 0; display: flex; align-items: center; font-size: 31px; font-weight: 800; line-height: 1.32;
  transition: opacity .7s, transform .7s; }
#hl .item span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#hl .item.in { opacity: 0; transform: translateY(26px); }
#hl .item.gone { opacity: 0; transform: translateY(-26px); }
#hlbar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
#hlbar i { display: block; height: 100%; width: 0; background: var(--up); }

#status { position: absolute; left: 22px; top: 2px; font-size: 11px; color: var(--dim); white-space: nowrap; }
#status.err { color: var(--warn); font-size: 14px; font-weight: 800; }
.empty { color: var(--dim); font-size: 18px; display: flex; align-items: center; height: 100%; }

/* 天気アイコンの小さな動き（太陽がゆっくり回る・雨が落ちる） */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drop { 0% { transform: translateY(-3px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(6px); opacity: 0; } }
#now .rays { transform-origin: 32px 32px; animation: spin 40s linear infinite; }
#now .drops line { animation: drop 1.4s linear infinite; }
#now .drops line:nth-child(2) { animation-delay: .45s; } #now .drops line:nth-child(3) { animation-delay: .9s; }
</style>
</head>
<body>
<div class="bg" id="bg1"></div><div class="bg" id="bg2"></div><div id="fx"></div><div id="shade"></div>
<div id="stage">
  <div id="top">
    <div id="clockbox">
      <div id="time" class="num">--:--</div>
      <div id="date">&nbsp;</div>
      <div id="chips"></div>
      <div id="indoor"></div>
    </div>
    <div class="card" id="now"></div>
  </div>
  <div class="card" id="panel"><div id="tabs"></div><div id="pages"></div></div>
  <div class="card" id="news">
    <div class="head"><span class="badge">NEWS</span><span id="newslabel"></span><span class="cnt" id="hlcnt"></span></div>
    <div id="hl"></div>
    <div id="hlbar"><i></i></div>
  </div>
  <div id="status"></div>
</div>
<script>
"use strict";
var WD = "日月火水木金土";
var PANEL_SEC = 10, HEADLINE_SEC = 8;
var data = null, offset = 0, tzMin = null, lastOk = 0, demo = /[?&]demo=1/.test(location.search);
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
function deg(v) { return v == null ? "—" : v + "°"; }

// ---- 画面に合わせて拡大縮小（幅 1024 を基準。高さは画面の縦横比から決める: 16:10 → 640）
function fit() {
  var h = Math.round(Math.min(760, Math.max(600, 1024 * innerHeight / innerWidth)));
  var s = Math.min(innerWidth / 1024, innerHeight / h), st = $("stage");
  st.style.height = h + "px";
  document.body.classList.toggle("tall", h >= 630);
  st.style.transform = "scale(" + s + ")";
  st.style.left = ((innerWidth - 1024 * s) / 2) + "px";
  st.style.top = ((innerHeight - h * s) / 2) + "px";
}
addEventListener("resize", fit); fit();

// ---- 天気アイコン（SVG）
function rays() {
  return [0, 45, 90, 135, 180, 225, 270, 315].map(function (a) { var r = a * Math.PI / 180;
    return '<line x1="' + (32 + Math.cos(r) * 17).toFixed(1) + '" y1="' + (32 + Math.sin(r) * 17).toFixed(1) +
      '" x2="' + (32 + Math.cos(r) * 23).toFixed(1) + '" y2="' + (32 + Math.sin(r) * 23).toFixed(1) + '"/>'; }).join("");
}
var SUN = '<circle cx="32" cy="32" r="11" fill="var(--sun)"/><g class="rays" stroke="var(--sun)" stroke-width="4" stroke-linecap="round">' + rays() + '</g>';
var MOON = '<path d="M40 14a19 19 0 1 0 12 30A16 16 0 0 1 40 14z" fill="#d4ddff"/>';
function cloud(x, y, s, c) { return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')"><path d="M18 46h30a12 12 0 0 0 0-24 16 16 0 0 0-30-2A13 13 0 0 0 18 46z" fill="' + (c || "var(--cloud)") + '"/></g>'; }
function icon(kind, day) {
  var b = day === false ? MOON : SUN, s;
  if (kind === "clear") s = b;
  else if (kind === "partly") s = '<g transform="translate(-6 -8) scale(.8)">' + b + '</g>' + cloud(6, 8, .85);
  else if (kind === "fog") s = cloud(-4, -8, 1) + '<g stroke="var(--cloud)" stroke-width="4" stroke-linecap="round"><line x1="12" y1="48" x2="52" y2="48"/><line x1="18" y1="56" x2="46" y2="56"/></g>';
  else if (kind === "rain") s = cloud(-4, -10, 1) + '<g class="drops" stroke="var(--rain)" stroke-width="4" stroke-linecap="round"><line x1="22" y1="46" x2="18" y2="56"/><line x1="33" y1="46" x2="29" y2="56"/><line x1="44" y1="46" x2="40" y2="56"/></g>';
  else if (kind === "snow") s = cloud(-4, -10, 1) + '<g fill="var(--snow)"><circle cx="20" cy="52" r="3.5"/><circle cx="32" cy="56" r="3.5"/><circle cx="44" cy="52" r="3.5"/></g>';
  else if (kind === "thunder") s = cloud(-4, -10, 1, "#8a94a3") + '<path d="M34 40l-8 12h7l-4 10 12-14h-7l4-8z" fill="var(--sun)"/>';
  else s = cloud(-4, -2, 1.05);
  return '<svg viewBox="0 0 64 64">' + s + '</svg>';
}
// ---- 背景（天気 × 朝・昼・夕方・夜）
// 上から下へのグラデーション。読みやすさのため、どれも白い文字が乗る濃さにしてある
var SKY = {
  clear:  { morning: ["#24508f", "#4f8cc9", "#e3a273"], day: ["#0d4ea6", "#2f86dc", "#62b2f2"],
            evening: ["#26285e", "#9b4a6c", "#ec8a4a"], night: ["#030818", "#0c1a3d", "#1b2d5c"] },
  partly: { morning: ["#2c4f7c", "#6a8db5", "#c49a7c"], day: ["#24548f", "#5185bd", "#86acd3"],
            evening: ["#302d58", "#7d5670", "#bb7a5e"], night: ["#070d1e", "#141f3a", "#243150"] },
  cloudy: { morning: ["#37414f", "#5f6b7c", "#8d857f"], day: ["#3d4757", "#5f6b7d", "#8692a3"],
            evening: ["#302f3c", "#57495a", "#7a6058"], night: ["#0a0d13", "#161b24", "#232a36"] },
  rain:   { morning: ["#1d2a3c", "#344b66", "#56708e"], day: ["#1a2d45", "#2f4d70", "#4b6c92"],
            evening: ["#1c1a2c", "#3a3150", "#5a4560"], night: ["#05080f", "#0e1522", "#182233"] },
  thunder:{ morning: ["#1d1a30", "#3a3358", "#5a5078"], day: ["#1f1b35", "#3c3463", "#5b4f86"],
            evening: ["#1a1428", "#3b2a4c", "#5c3d58"], night: ["#06050d", "#120f22", "#1f1a36"] },
  snow:   { morning: ["#4b5d76", "#8396b0", "#c9b9b4"], day: ["#55697f", "#8aa0bb", "#b4c6da"],
            evening: ["#3b3b55", "#6d6584", "#9a8296"], night: ["#0f1626", "#1f2b44", "#33425f"] },
  fog:    { morning: ["#46505b", "#76808b", "#a59c95"], day: ["#4f5965", "#7a8591", "#a3acb6"],
            evening: ["#3a3a44", "#625a63", "#86766f"], night: ["#0d1015", "#1b2028", "#2a3039"] }
};
var PHASE_JA = { morning: "朝", day: "昼", evening: "夕方", night: "夜" };
function phaseOf(n, w) {
  var h = n.getUTCHours();
  if (w && w.is_day === false) return "night";       // 日の出前・日の入り後
  if (!w && (h < 5 || h >= 19)) return "night";
  if (h < 9) return "morning";
  if (h >= 16) return "evening";
  return "day";
}
var bgKey = "", bgFront = 1;
function applyBackground() {
  var w = data && data.weather, n = serverNow();
  var kind = w ? w.icon : "cloudy", phase = phaseOf(n, w);
  var q = /[?&]sky=(\w+)-(\w+)/.exec(location.search);  // 確認用: ?sky=rain-evening
  if (q) { kind = q[1]; phase = q[2]; }
  var key = kind + "-" + phase;
  if (key === bgKey) return;
  bgKey = key;
  var c = (SKY[kind] || SKY.cloudy)[phase] || SKY.cloudy.day;
  var next = $(bgFront === 1 ? "bg2" : "bg1"), cur = $(bgFront === 1 ? "bg1" : "bg2");
  next.style.background = "linear-gradient(180deg, " + c[0] + " 0%, " + c[1] + " 55%, " + c[2] + " 100%)";
  next.style.opacity = 1; cur.style.opacity = 0;
  bgFront = bgFront === 1 ? 2 : 1;
  // 天気の動き（雨・雪・星・日差し・夕焼け）
  var fx = kind === "rain" || kind === "thunder" ? "rain" : kind === "snow" ? "snow"
    : phase === "night" && (kind === "clear" || kind === "partly") ? "stars"
    : phase === "day" && kind === "clear" ? "sunny" : phase === "evening" && (kind === "clear" || kind === "partly") ? "dusk" : "";
  $("fx").className = fx;
  document.documentElement.setAttribute("data-sky", key);
}

// ---- 今日のお知らせ（ゴミ・祝日・二十四節気・雑節）
var TRASH = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zM6 8h12l-1 13H7L6 8z"/></svg>';
var SEASON = { 春: "#3fae5a", 夏: "#1aa3a3", 秋: "#d9772b", 冬: "#3f74c9" };
function sekkiColor(name) {
  var order = ["立春", "雨水", "啓蟄", "春分", "清明", "穀雨", "立夏", "小満", "芒種", "夏至", "小暑", "大暑",
               "立秋", "処暑", "白露", "秋分", "寒露", "霜降", "立冬", "小雪", "大雪", "冬至", "小寒", "大寒"];
  var i = order.indexOf(name);
  return i < 0 ? "#555" : [SEASON.春, SEASON.夏, SEASON.秋, SEASON.冬][Math.floor(i / 6)];
}
function minutesOf(hhmm, def) { var m = /^(\d+):(\d+)$/.exec(hhmm || def); return +m[1] * 60 + +m[2]; }
var chipsKey = "";
function drawChips() {
  var t = (data && data.today) || {}, n = serverNow(), now = n.getUTCHours() * 60 + n.getUTCMinutes(), out = [];
  var until = minutesOf(t.garbage_until, "09:00"), evening = minutesOf(t.garbage_evening, "17:00");
  if (t.garbage && t.garbage.length && now < 12 * 60)
    out.push('<span class="chip gomi' + (now >= until ? " later" : "") + '">' + TRASH + '今日は ' + t.garbage.map(esc).join("・") + '</span>');
  if (t.garbage_tomorrow && t.garbage_tomorrow.length && now >= evening)
    out.push('<span class="chip gomi tomorrow">' + TRASH + '明日は ' + t.garbage_tomorrow.map(esc).join("・") + '</span>');
  var hol = data && data.events ? data.events.filter(function (e) { return e.today && e.holiday; })[0] : null;
  if (hol) out.push('<span class="chip hol">' + esc(hol.title) + '</span>');
  if (t.sekki) out.push('<span class="chip sekki" style="background:' + sekkiColor(t.sekki) + '"><small>二十四節気</small>' + esc(t.sekki) + '</span>');
  (t.zassetsu || []).forEach(function (z) { out.push('<span class="chip zas">' + esc(z) + '</span>'); });
  var html = out.join("");
  if (html !== chipsKey) { chipsKey = html; $("chips").innerHTML = html; }
}

// ---- 時計（端末の時計を NAS の時刻・時刻帯に合わせる。getUTC* が NAS の現地時刻になる）
function serverNow() {
  var t = Date.now() + offset, tz = tzMin == null ? -new Date(t).getTimezoneOffset() : tzMin;
  return new Date(t + tz * 60000);
}
function tick() {
  var n = serverNow(), h = n.getUTCHours(), m = n.getUTCMinutes(), w = n.getUTCDay();
  $("time").innerHTML = h + '<span class="colon" style="opacity:' + (n.getUTCSeconds() % 2 ? .3 : 1) + '">:</span>' + (m < 10 ? "0" : "") + m;
  var hol = data && data.events ? data.events.some(function (e) { return e.today && e.holiday; }) : false;
  $("date").innerHTML = (n.getUTCMonth() + 1) + "月" + n.getUTCDate() + "日 <span class=\"" + (w === 0 || hol ? "sun" : w === 6 ? "sat" : "") + "\">" +
    WD[w] + "曜日</span>";
  if (n.getUTCSeconds() === 0 || !bgKey) { applyBackground(); drawChips(); }
  night(n);
}

// 夜は暗く（Fully Kiosk Browser なら本体の明るさも）
var lastBright = null;
function inRange(n, r) {
  if (!r || r.length !== 2) return false;
  var t = n.getUTCHours() * 60 + n.getUTCMinutes(), a = r[0].split(":"), b = r[1].split(":");
  var s = +a[0] * 60 + +a[1], e = +b[0] * 60 + +b[1];
  return s <= e ? (t >= s && t < e) : (t >= s || t < e);
}
function night(n) {
  var web = (data && data.web) || {};
  var isNight = /[?&]night=0/.test(location.search) ? false : inRange(n, web.night);
  document.body.classList.toggle("night", isNight);
  var br = web.brightness && (isNight ? web.brightness.night : web.brightness.day);
  if (window.fully && br != null && br !== lastBright) { try { fully.setScreenBrightness(br); lastBright = br; } catch (e) {} }
}

// ---- 上段
function drawNow(w) {
  var el = $("now");
  if (!w) { el.innerHTML = '<div class="empty" style="grid-column:1/3;padding-left:20px">天気を取得できません</div>'; return; }
  var c = w.clothing;
  var tip = c && c.tips.length ? c.tips[0] : (w.pop >= 50 ? "傘を持って" : "");
  el.innerHTML = '<div class="icon">' + icon(w.icon, w.is_day) + '</div>' +
    '<div><div class="temp num">' + w.temp + '<small>℃</small></div><div class="label">' + esc(w.label) + '</div>' +
    '<div class="meta num"><span><span class="hi">' + deg(w.max) + '</span> / <span class="lo">' + deg(w.min) + '</span></span>' +
    '<span>☂ ' + (w.pop == null ? "—" : w.pop + "%") + '</span><span>体感 ' + deg(w.apparent) + '</span></div></div>' +
    (c ? '<div class="cloth">' + esc(c.day) + '：' + esc(c.phrase) + '</div>' : "") +
    (tip ? '<div class="tip">' + esc(tip) + '</div>' : "");
}

function drawIndoor(ind) {
  if (!ind) { $("indoor").innerHTML = ""; return; }
  var pill = function (k, v, u, warn) { return v == null ? "" : '<div class="pill' + (warn ? " warn" : "") + '"><span class="k">' + k + '</span><span class="v num">' + v + '</span><span class="u">' + u + '</span></div>'; };
  var dry = ind.humidity != null && (ind.humidity < 40 || ind.humidity > 70);
  $("indoor").innerHTML = pill("室温", ind.temp, "℃") + pill("湿度", ind.humidity, "%", dry) +
    pill("CO₂", ind.co2, "ppm", ind.co2 != null && ind.co2 >= 1000);
}

// ---- 中段: パネル（ある情報だけを順番に）
function panels() {
  var d = data || {}, w = d.weather, out = [];
  if (w && w.hourly && w.hourly.length) out.push(["時間ごと", pageHours]);
  if (w && w.chart && w.chart.length > 1) out.push([w.chart_label + "の気温", pageChart]);
  if (w && w.daily && w.daily.length) out.push(["この先", pageDays]);
  if (d.quotes && d.quotes.length) out.push(["マーケット", pageMarket]);
  if (d.events && d.events.length) out.push(["予定", pageEvents]);
  return out;
}

function pageHours(w) {
  w = data.weather;
  return '<div class="hours">' + w.hourly.map(function (h, i) {
    return '<div class="' + (i === 0 ? "now" : "") + '"><div class="t">' + h.time + '</div>' + icon(h.icon, h.is_day) +
      '<div class="tp num">' + deg(h.temp) + '</div><div class="pp num">' + (h.pop ? "☂" + h.pop + "%" : "") + '</div></div>'; }).join("") + '</div>';
}

function pageChart() {
  var pts = data.weather.chart, W = 956, H = document.body.classList.contains("tall") ? 148 : 118, top = 18, bot = 18;
  var ts = pts.map(function (p) { return p.temp; });
  var lo = Math.min.apply(null, ts) - 1, hi = Math.max.apply(null, ts) + 1;
  var x = function (h) { return 14 + h / 23 * (W - 28); };
  var y = function (t) { return top + (1 - (t - lo) / (hi - lo)) * (H - top - bot); };
  var bars = pts.map(function (p) { var bh = (p.pop || 0) / 100 * (H - bot - 4);
    return '<rect x="' + (x(p.h) - 13).toFixed(1) + '" y="' + (H - bot - bh).toFixed(1) + '" width="26" height="' + bh.toFixed(1) + '" rx="4" fill="var(--rain)" opacity=".22"/>'; }).join("");
  var line = pts.map(function (p, i) { return (i ? "L" : "M") + x(p.h).toFixed(1) + " " + y(p.temp).toFixed(1); }).join("");
  var area = line + "L" + x(pts[pts.length - 1].h).toFixed(1) + " " + (H - bot) + "L" + x(pts[0].h).toFixed(1) + " " + (H - bot) + "Z";
  var labels = [0, 3, 6, 9, 12, 15, 18, 21].map(function (h) { return '<text x="' + x(h) + '" y="' + (H - 2) + '" font-size="13" font-weight="600" fill="var(--sub)" text-anchor="middle">' + h + '時</text>'; }).join("");
  var n = serverNow(), hx = x(n.getUTCHours() + n.getUTCMinutes() / 60);
  var iMax = ts.indexOf(Math.max.apply(null, ts)), iMin = ts.indexOf(Math.min.apply(null, ts));
  var mark = function (i, col, dy) { return '<text x="' + x(pts[i].h) + '" y="' + (y(pts[i].temp) + dy) + '" font-size="17" font-weight="800" fill="' + col + '" text-anchor="middle">' + Math.round(pts[i].temp) + '°</text>'; };
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc93c" stop-opacity=".35"/><stop offset="1" stop-color="#ffc93c" stop-opacity="0"/></linearGradient></defs>' +
    bars + '<path d="' + area + '" fill="url(#g)"/><path d="' + line + '" fill="none" stroke="var(--sun)" stroke-width="3.5" stroke-linejoin="round"/>' +
    '<line x1="' + hx + '" x2="' + hx + '" y1="4" y2="' + (H - bot) + '" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 4" opacity=".6"/>' +
    labels + mark(iMax, "var(--up)", -8) + mark(iMin, "var(--rain)", 20) + '</svg></div>';
}

function pageDays() {
  return '<div class="days">' + data.weather.daily.map(function (d) {
    return '<div class="d">' + icon(d.icon, true) + '<div><div class="dt' + (d.weekend ? " we" : "") + '">' + d.date + '（' + d.weekday + '）</div>' +
      '<div class="tt num"><span class="hi">' + deg(d.max) + '</span> <span class="lo">' + deg(d.min) + '</span></div>' +
      '<div class="lb">' + esc(d.label) + (d.pop == null ? "" : '　☂' + d.pop + '%') + '</div></div></div>'; }).join("") + '</div>';
}

function pageMarket() {
  var qs = data.quotes.slice(0, 3);
  return '<div class="quotes" style="grid-template-columns:repeat(' + qs.length + ',1fr)">' + qs.map(function (q) {
    if (q.missing) return '<div class="q"><div class="lb">' + esc(q.label) + '</div><div class="pr">—</div></div>';
    var cls = q.dir > 0 ? "up" : q.dir < 0 ? "down" : "flat", arrow = q.dir > 0 ? "▲" : q.dir < 0 ? "▼" : "";
    return '<div class="q"><div class="lb">' + esc(q.label) + '<small>' + esc(q.note) + '</small></div>' +
      '<div class="pr num">' + q.price + '<small>' + esc(q.unit) + '</small></div>' +
      '<div class="ch num ' + cls + '"><span class="arrow">' + arrow + '</span>' + q.change.replace(/^[+−]/, "") + '（' + q.pct + '）</div></div>'; }).join("") + '</div>';
}

function pageEvents() {
  return '<div class="events">' + data.events.slice(0, 4).map(function (e) {
    return '<div class="e' + (e.today ? " today" : "") + (e.holiday ? " hol" : "") + '"><div class="w">' +
      (e.today ? "今日" : e.date + "（" + e.weekday + "）") + '<br>' + esc(e.time) + '</div><div class="ti">' + esc(e.title) + '</div></div>'; }).join("") + '</div>';
}

var pIdx = 0, pTimer = null, pList = [];
function showPanel(advance) {
  pList = panels();
  if (!pList.length) { $("tabs").innerHTML = ""; $("pages").innerHTML = '<div class="page on"><div class="empty">データを待っています</div></div>'; return; }
  if (advance) pIdx = (pIdx + 1) % pList.length; else pIdx = Math.min(pIdx, pList.length - 1);
  $("tabs").innerHTML = pList.map(function (p, i) { return '<span class="tab' + (i === pIdx ? " on" : "") + '">' + esc(p[0]) + '</span>'; }).join("") + '<span class="bar"><i></i></span>';
  var old = $("pages").firstChild, el = document.createElement("div");
  el.className = "page";
  el.innerHTML = pList[pIdx][1]();
  $("pages").appendChild(el);
  if (old && advance) { old.className = "page out"; setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 700); }
  else if (old) old.parentNode.removeChild(old);
  requestAnimationFrame(function () { requestAnimationFrame(function () { el.className = "page on"; }); });
  progress(document.querySelector("#tabs .bar i"), PANEL_SEC);
}
function progress(bar, sec) {
  if (!bar) return;
  bar.style.transition = "none"; bar.style.width = "0";
  void bar.offsetWidth;
  bar.style.transition = "width " + sec + "s linear"; bar.style.width = "100%";
}
function startPanels() { clearInterval(pTimer); pTimer = setInterval(function () { showPanel(true); }, PANEL_SEC * 1000); }
$("panel").addEventListener("click", function () { showPanel(true); startPanels(); });  // タップで次へ

// ---- 下段: ヘッドライン
var hIdx = -1, hTimer = null;
function showHeadline(advance) {
  var list = (data && data.news) || [];
  $("newslabel").textContent = (data && data.news_label) || "";
  if (!list.length) { $("hl").innerHTML = '<div class="item"><span style="color:var(--dim);font-size:22px">ニュースを取得できません</span></div>'; $("hlcnt").textContent = ""; return; }
  hIdx = advance || hIdx < 0 ? (hIdx + 1) % list.length : Math.min(hIdx, list.length - 1);
  $("hlcnt").textContent = (hIdx + 1) + " / " + list.length;
  var old = $("hl").firstChild, el = document.createElement("div");
  el.className = "item in";
  el.innerHTML = "<span>" + esc(list[hIdx]) + "</span>";
  $("hl").appendChild(el);
  if (old) { old.className = "item gone"; setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 800); }
  requestAnimationFrame(function () { requestAnimationFrame(function () { el.className = "item"; }); });
  progress(document.querySelector("#hlbar i"), HEADLINE_SEC);
}
function startHeadlines() { clearInterval(hTimer); hTimer = setInterval(function () { showHeadline(true); }, HEADLINE_SEC * 1000); }
$("news").addEventListener("click", function () { showHeadline(true); startHeadlines(); });  // タップで次へ

// ---- 状態表示
function drawStatus() {
  var st = $("status"), msgs = [];
  if (data && data.failing && data.failing.length) msgs.push("取得失敗: " + data.failing.join("・"));
  if (lastOk && Date.now() - lastOk > 5 * 60000) msgs.push("サーバーに接続できません");
  if (!lastOk && !data) msgs.push("サーバーに接続しています…");
  st.className = msgs.length ? "err" : "";
  st.textContent = msgs.join("　");
}

var started = false;
function render() {
  drawNow(data.weather); drawIndoor(data.indoor); drawStatus(); applyBackground(); drawChips();
  if (!started) { started = true; showPanel(false); startPanels(); showHeadline(true); startHeadlines(); }
}

// 時計の数字のフォント（config の clock.font）
var clockFontLoaded = false;
function loadClockFont(name) {
  if (clockFontLoaded || !name) return;
  clockFontLoaded = true;
  var st = document.createElement("style");
  st.textContent = '@font-face{font-family:"Clock";src:url("/fonts/' + encodeURIComponent(name) + '");font-display:swap}';
  document.head.appendChild(st);
}

function load() {
  var x = new XMLHttpRequest();
  x.open("GET", "/data.json" + (demo ? "?demo=1" : ""), true);
  x.timeout = 20000;
  x.onload = function () {
    if (x.status !== 200) return drawStatus();
    try { data = JSON.parse(x.responseText); } catch (e) { return drawStatus(); }
    if (data.now) {
      offset = new Date(data.now).getTime() - Date.now();
      var z = /([+-])(\d\d):(\d\d)$/.exec(data.now);
      tzMin = z ? (z[1] === "-" ? -1 : 1) * (+z[2] * 60 + +z[3]) : null;
    }
    lastOk = Date.now();
    loadClockFont(data.clock_font);
    render(); tick();
  };
  x.onerror = x.ontimeout = drawStatus;
  x.send();
}

tick(); drawStatus(); load();
setInterval(tick, 1000);
setInterval(load, 60000);
// 長時間つけっぱなしでも重くならないよう、6 時間ごとに読み込み直す
setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);
</script>
</body>
</html>
