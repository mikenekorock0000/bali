<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>ダッシュボード</title>
<style>
/* Fire 7（1024x600 横置き）向け。#stage を画面に合わせて拡大縮小するので、他の画面でも崩れない */
@font-face { font-family: "JP"; src: url("/fonts/NotoSansJP-VF.ttf"); font-weight: 100 900; font-display: swap; }
:root {
  --bg: #0b0e13; --card: #151a22; --line: #232a35; --text: #f2f4f7; --sub: #8b94a3; --dim: #586172;
  --sun: #ffc93c; --rain: #4aa8ff; --cloud: #a7b1bf; --snow: #e8f1ff; --up: #ff6b6b; --down: #4dd4a0;
  --accent: #6ea8ff; --warn: #ffb020;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body { font-family: "JP", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; -webkit-user-select: none; user-select: none; }
#stage { position: absolute; left: 0; top: 0; width: 1024px; height: 600px; transform-origin: 0 0;
  display: grid; grid-template-columns: 372px 604px; gap: 14px; padding: 14px 16px; transition: filter 2s; }
body.night #stage { filter: brightness(.45); }
.col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.card { background: var(--card); border-radius: 16px; padding: 12px 16px; position: relative; overflow: hidden; }
.h { font-size: 13px; color: var(--sub); font-weight: 600; letter-spacing: .04em; display: flex; justify-content: space-between; }
.h small { font-weight: 500; color: var(--dim); }
.num { font-variant-numeric: tabular-nums; }

/* 時計 */
#clock { padding: 4px 6px 0; }
#time { font-family: "Clock", "JP", sans-serif; font-size: 132px; line-height: 1; letter-spacing: -.01em; }
#time .colon { display: inline-block; transform: translateY(-.06em); }
#date { font-size: 24px; font-weight: 600; color: var(--sub); margin-top: 2px; }
#date .wd.sat { color: var(--accent); } #date .wd.sun { color: var(--up); }

/* 今の天気 */
#now { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; align-items: center; flex: 1; }
#now .icon svg { width: 96px; height: 96px; }
#now .temp { font-size: 54px; font-weight: 700; line-height: 1; }
#now .temp small { font-size: 26px; color: var(--sub); font-weight: 500; }
#now .label { font-size: 18px; font-weight: 600; margin-top: 4px; }
#now .meta { grid-column: 1 / 3; display: flex; gap: 14px; font-size: 14px; color: var(--sub); }
#now .meta b { color: var(--text); font-weight: 600; }
.hi { color: var(--up); } .lo { color: var(--rain); }

/* 室内 */
#indoor .row { display: flex; align-items: baseline; gap: 18px; margin-top: 4px; }
#indoor .v { font-size: 34px; font-weight: 700; }
#indoor .v small { font-size: 15px; color: var(--sub); font-weight: 500; margin-left: 2px; }
.chip { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: #233; color: var(--down); }
.chip.bad { background: #3a2a14; color: var(--warn); }

/* 時間ごと */
#hourly { display: grid; grid-template-columns: repeat(8, 1fr); text-align: center; margin-top: 4px; }
#hourly .t { font-size: 13px; color: var(--sub); }
#hourly svg { width: 40px; height: 40px; margin: 2px auto; display: block; }
#hourly .tp { font-size: 19px; font-weight: 700; }
#hourly .pp { font-size: 12px; color: var(--rain); height: 16px; }
#chart { height: 54px; margin-top: 2px; }
#chart svg { width: 100%; height: 100%; display: block; }

.row2 { display: grid; grid-template-columns: 288px 1fr; gap: 12px; }
/* 週間＋服装 */
#daily .d { display: grid; grid-template-columns: 74px 30px 1fr 40px; white-space: nowrap; align-items: center; gap: 6px; height: 30px; font-size: 15px; }
#daily .d svg { width: 28px; height: 28px; }
#daily .d .wd.weekend { color: var(--accent); }
#daily .d .pop { font-size: 12px; color: var(--rain); text-align: right; }
#cloth { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 7px; display: flex; gap: 10px; align-items: center; }
#cloth .idx { font-size: 26px; font-weight: 800; color: var(--sun); min-width: 40px; }
#cloth .ph { font-size: 15px; font-weight: 700; }
#cloth .tips { font-size: 12px; color: var(--warn); margin-top: 1px; }

/* マーケット */
#market .q { display: grid; grid-template-columns: 1fr auto; align-items: center; height: 46px; border-bottom: 1px solid var(--line); }
#market .q:last-child { border: 0; }
#market .lb { font-size: 14px; font-weight: 600; }
#market .lb small { display: block; font-size: 11px; color: var(--dim); font-weight: 500; }
#market .pr { font-size: 22px; font-weight: 700; text-align: right; }
#market .pr small { font-size: 12px; color: var(--sub); margin-left: 1px; }
#market .ch { font-size: 12px; font-weight: 600; text-align: right; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--sub); }

/* 下段: 予定とニュース */
#bottom { flex: 1; display: grid; gap: 12px; min-height: 0; }
#bottom.both { grid-template-columns: 250px 1fr; }
#events .e { display: grid; grid-template-columns: 54px 1fr; gap: 6px; font-size: 14px; padding: 4px 0; border-bottom: 1px solid var(--line); }
#events .e:last-child { border: 0; }
#events .e .when { color: var(--sub); font-size: 12px; line-height: 1.25; }
#events .e.today .when { color: var(--sun); font-weight: 700; }
#events .e.holiday .ti { color: var(--up); }
#events .e .ti { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
#news ul { list-style: none; margin-top: 4px; }
#news li { font-size: 15px; font-weight: 600; line-height: 1.3; padding: 3px 0 3px 14px; position: relative;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--line); }
#news li:last-child { border: 0; }
#news li::before { content: ""; position: absolute; left: 0; top: 11px; width: 5px; height: 5px; border-radius: 3px; background: var(--accent); }
#news li.in { animation: fade .8s; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

#status { font-size: 10px; color: var(--dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status.err { color: var(--warn); font-size: 13px; font-weight: 700; }
.empty { color: var(--dim); font-size: 14px; padding: 8px 0; }
</style>
</head>
<body>
<div id="stage">
  <div class="col">
    <div id="clock"><div id="time" class="num">--:--</div><div id="date">&nbsp;</div><div id="status"></div></div>
    <div class="card" style="flex:1;display:flex;flex-direction:column">
      <div class="h"><span>いまの天気</span><small id="wind"></small></div>
      <div id="now"></div>
    </div>
    <div class="card" id="indoor"><div class="h"><span>室内</span><span id="ilevel"></span></div><div class="row" id="irow"></div></div>
  </div>
  <div class="col">
    <div class="card"><div class="h"><span>時間ごとの天気</span><small id="chartlabel"></small></div>
      <div id="hourly"></div><div id="chart"></div></div>
    <div class="row2">
      <div class="card" id="dailycard"><div class="h"><span>この先の天気</span></div><div id="daily"></div><div id="cloth"></div></div>
      <div class="card" id="market"><div class="h"><span>マーケット</span><small id="mtime"></small></div><div id="quotes"></div></div>
    </div>
    <div id="bottom">
      <div class="card" id="events"><div class="h"><span>予定</span><small>1週間</small></div><div id="elist"></div></div>
      <div class="card" id="news"><div class="h"><span>主要ニュース</span><small id="newslabel"></small></div><ul id="nlist"></ul></div>
    </div>
  </div>
</div>
<script>
"use strict";
var WD = "日月火水木金土";
var data = null, offset = 0, tzMin = null, lastOk = 0, newsPos = 0, demo = /[?&]demo=1/.test(location.search);
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
function deg(v) { return v == null ? "—" : v + "°"; }

// ---- 画面に合わせて拡大縮小（1024x600 を基準）
function fit() {
  var s = Math.min(innerWidth / 1024, innerHeight / 600);
  var st = $("stage");
  st.style.transform = "scale(" + s + ")";
  st.style.left = ((innerWidth - 1024 * s) / 2) + "px";
  st.style.top = ((innerHeight - 600 * s) / 2) + "px";
}
addEventListener("resize", fit); fit();

// ---- 天気アイコン（SVG）
var SUN = '<circle cx="32" cy="32" r="11" fill="var(--sun)"/><g stroke="var(--sun)" stroke-width="4" stroke-linecap="round">' +
  [0, 45, 90, 135, 180, 225, 270, 315].map(function (a) { var r = a * Math.PI / 180;
    return '<line x1="' + (32 + Math.cos(r) * 17).toFixed(1) + '" y1="' + (32 + Math.sin(r) * 17).toFixed(1) +
           '" x2="' + (32 + Math.cos(r) * 23).toFixed(1) + '" y2="' + (32 + Math.sin(r) * 23).toFixed(1) + '"/>'; }).join("") + '</g>';
var MOON = '<path d="M40 14a19 19 0 1 0 12 30A16 16 0 0 1 40 14z" fill="#c9d6ff"/>';
function cloud(x, y, s, c) { return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')"><path d="M18 46h30a12 12 0 0 0 0-24 16 16 0 0 0-30-2A13 13 0 0 0 18 46z" fill="' + (c || "var(--cloud)") + '"/></g>'; }
function icon(kind, day) {
  var b = day === false ? MOON : SUN, s = "";
  if (kind === "clear") s = b;
  else if (kind === "partly") s = '<g transform="translate(-6 -8) scale(.8)">' + b + '</g>' + cloud(6, 8, .85);
  else if (kind === "cloudy") s = cloud(-4, -2, 1.05);
  else if (kind === "fog") s = cloud(-4, -8, 1) + '<g stroke="var(--cloud)" stroke-width="4" stroke-linecap="round"><line x1="12" y1="48" x2="52" y2="48"/><line x1="18" y1="56" x2="46" y2="56"/></g>';
  else if (kind === "rain") s = cloud(-4, -10, 1) + '<g stroke="var(--rain)" stroke-width="4" stroke-linecap="round"><line x1="22" y1="46" x2="18" y2="56"/><line x1="33" y1="46" x2="29" y2="56"/><line x1="44" y1="46" x2="40" y2="56"/></g>';
  else if (kind === "snow") s = cloud(-4, -10, 1) + '<g fill="var(--snow)"><circle cx="20" cy="52" r="3.5"/><circle cx="32" cy="56" r="3.5"/><circle cx="44" cy="52" r="3.5"/></g>';
  else if (kind === "thunder") s = cloud(-4, -10, 1, "#7d8796") + '<path d="M34 40l-8 12h7l-4 10 12-14h-7l4-8z" fill="var(--sun)"/>';
  else s = cloud(-4, -2, 1.05);
  return '<svg viewBox="0 0 64 64">' + s + '</svg>';
}

// ---- 時計（端末の時計をサーバーの時刻・時刻帯に合わせて使う）
// 返す Date は getUTC* がサーバー側の現地時刻になる（タブレットの時刻帯の設定に左右されない）
function serverNow() {
  var t = Date.now() + offset;
  var tz = tzMin == null ? -new Date(t).getTimezoneOffset() : tzMin;
  return new Date(t + tz * 60000);
}
function tick() {
  var n = serverNow();
  var h = n.getUTCHours(), m = n.getUTCMinutes();
  $("time").innerHTML = h + '<span class="colon" style="opacity:' + (n.getUTCSeconds() % 2 ? .35 : 1) + '">:</span>' + (m < 10 ? "0" : "") + m;
  var w = n.getUTCDay();
  $("date").innerHTML = (n.getUTCMonth() + 1) + "月" + n.getUTCDate() + "日 <span class=\"wd" + (w === 0 ? " sun" : w === 6 ? " sat" : "") + "\">" + WD[w] + "曜日</span>";
  night(n);
}

// 夜は暗く（Fully Kiosk Browser なら本体の明るさも）
var lastBright = null;
function inRange(n, r) {
  if (!r || r.length !== 2) return false;
  var t = n.getUTCHours() * 60 + n.getUTCMinutes();
  var a = r[0].split(":"), b = r[1].split(":");
  var s = +a[0] * 60 + +a[1], e = +b[0] * 60 + +b[1];
  return s <= e ? (t >= s && t < e) : (t >= s || t < e);
}
function night(n) {
  var web = (data && data.web) || {};
  var isNight = /[?&]night=0/.test(location.search) ? false : inRange(n, web.night);
  document.body.classList.toggle("night", isNight);
  var br = web.brightness && (isNight ? web.brightness.night : web.brightness.day);
  if (window.fully && br != null && br !== lastBright) { try { fully.setScreenBrightness(br); lastBright = br; } catch (e) {} }
}

// ---- 各欄
function drawWeather(w) {
  if (!w) { $("now").innerHTML = '<div class="empty" style="grid-column:1/3">天気を取得できません</div>'; $("hourly").innerHTML = ""; $("chart").innerHTML = ""; $("daily").innerHTML = ""; $("cloth").innerHTML = ""; return; }
  $("wind").textContent = w.wind;
  $("now").innerHTML = '<div class="icon">' + icon(w.icon, w.is_day) + '</div>' +
    '<div><div class="temp num">' + w.temp + '<small>℃</small></div><div class="label">' + esc(w.label) + '</div></div>' +
    '<div class="meta"><span><span class="hi">' + deg(w.max) + '</span> / <span class="lo">' + deg(w.min) + '</span></span>' +
    '<span>降水 <b>' + (w.pop == null ? "—" : w.pop + "%") + '</b></span><span>体感 <b>' + deg(w.apparent) + '</b></span>' +
    '<span>湿度 <b>' + (w.humidity == null ? "—" : w.humidity + "%") + '</b></span></div>';
  $("hourly").innerHTML = w.hourly.map(function (h) {
    return '<div><div class="t">' + h.time + '</div>' + icon(h.icon, h.is_day) + '<div class="tp num">' + deg(h.temp) + '</div>' +
      '<div class="pp">' + (h.pop ? h.pop + "%" : "") + '</div></div>'; }).join("");
  $("chartlabel").textContent = w.chart && w.chart.length ? w.chart_label + "の気温と降水確率" : "";
  drawChart(w.chart || []);
  $("daily").innerHTML = w.daily.map(function (d) {
    return '<div class="d"><span>' + d.date + ' <span class="wd' + (d.weekend ? " weekend" : "") + '">' + d.weekday + '</span></span>' +
      icon(d.icon, true) + '<span class="num"><span class="hi">' + deg(d.max) + '</span> / <span class="lo">' + deg(d.min) + '</span></span>' +
      '<span class="pop">' + (d.pop == null ? "" : d.pop + "%") + '</span></div>'; }).join("");
  var c = w.clothing;
  $("cloth").innerHTML = c ? '<div class="idx num">' + c.index + '</div><div><div class="ph">' + esc(c.day) + '：' + esc(c.phrase) + '</div>' +
    '<div class="tips">' + c.tips.map(esc).join("・") + '</div></div>' : "";
}

function drawChart(pts) {
  if (pts.length < 2) { $("chart").innerHTML = ""; return; }
  var W = 572, H = 54, top = 13, bot = 14;
  var ts = pts.map(function (p) { return p.temp; });
  var lo = Math.min.apply(null, ts) - 1, hi = Math.max.apply(null, ts) + 1;
  var x = function (h) { return 8 + h / 23 * (W - 16); };
  var y = function (t) { return top + (1 - (t - lo) / (hi - lo)) * (H - top - bot); };
  var bars = pts.map(function (p) { var bh = (p.pop || 0) / 100 * (H - bot - 2);
    return '<rect x="' + (x(p.h) - 7).toFixed(1) + '" y="' + (H - bot - bh).toFixed(1) + '" width="14" height="' + bh.toFixed(1) + '" rx="2" fill="var(--rain)" opacity=".28"/>'; }).join("");
  var line = pts.map(function (p, i) { return (i ? "L" : "M") + x(p.h).toFixed(1) + " " + y(p.temp).toFixed(1); }).join("");
  var labels = [0, 6, 12, 18, 23].map(function (h) { return '<text x="' + x(h) + '" y="' + (H - 2) + '" font-size="10" fill="var(--dim)" text-anchor="middle">' + h + '</text>'; }).join("");
  var n = serverNow(), hx = x(n.getUTCHours() + n.getUTCMinutes() / 60);
  var now = '<line x1="' + hx + '" x2="' + hx + '" y1="2" y2="' + (H - bot) + '" stroke="var(--sun)" stroke-width="1.5" stroke-dasharray="3 3"/>';
  var iMax = ts.indexOf(Math.max.apply(null, ts)), iMin = ts.indexOf(Math.min.apply(null, ts));
  var mark = function (i, cls, dy) { return '<text x="' + x(pts[i].h) + '" y="' + (y(pts[i].temp) + dy) + '" font-size="11" font-weight="700" fill="var(--' + cls + ')" text-anchor="middle">' + Math.round(pts[i].temp) + '°</text>'; };
  $("chart").innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + bars + now +
    '<path d="' + line + '" fill="none" stroke="var(--sun)" stroke-width="2.5" stroke-linejoin="round"/>' + labels +
    mark(iMax, "up", -4) + mark(iMin, "rain", 12) + '</svg>';
}

function drawIndoor(ind) {
  $("indoor").style.display = ind ? "" : "none";
  if (!ind) return;
  var v = function (x, u) { return '<span class="v num">' + (x == null ? "—" : x) + '<small>' + u + '</small></span>'; };
  $("irow").innerHTML = v(ind.temp, "℃") + v(ind.humidity, "%") + (ind.co2 != null ? v(ind.co2, "ppm") : "");
  var bad = /乾燥|多湿|高い|換気/.test(ind.level || "");
  $("ilevel").innerHTML = ind.level ? '<span class="chip' + (bad ? " bad" : "") + '">' + esc(ind.level) + '</span>' : "";
}

function drawMarket(qs) {
  $("market").style.display = qs.length ? "" : "none";
  var times = qs.map(function (q) { return q.note; }).filter(function (n) { return /^\d+:\d+$/.test(n); });
  $("mtime").textContent = times.length ? times.sort().pop() + " 時点" : "";
  $("quotes").innerHTML = qs.slice(0, 4).map(function (q) {
    if (q.missing) return '<div class="q"><div class="lb">' + esc(q.label) + '</div><div class="pr">—</div></div>';
    var cls = q.dir > 0 ? "up" : q.dir < 0 ? "down" : "flat";
    var note = /基準/.test(q.note) ? '<small>' + esc(q.note) + '</small>' : "";
    return '<div class="q"><div class="lb">' + esc(q.label) + note + '</div><div><div class="pr num">' + q.price + '<small>' + esc(q.unit) + '</small></div>' +
      '<div class="ch num ' + cls + '">' + q.change + ' (' + q.pct + ')</div></div></div>'; }).join("");
}

function drawEvents(evs) {
  var has = evs && evs.length;
  $("events").style.display = has ? "" : "none";
  $("bottom").className = has ? "both" : "";
  if (!has) return;
  $("elist").innerHTML = evs.slice(0, 5).map(function (e) {
    return '<div class="e' + (e.today ? " today" : "") + (e.holiday ? " holiday" : "") + '"><div class="when">' +
      (e.today ? "今日" : e.date + "(" + e.weekday + ")") + '<br>' + esc(e.time) + '</div><div class="ti">' + esc(e.title) + '</div></div>'; }).join("");
}

// ニュースは 4 件ずつ 15 秒ごとに入れ替える
function drawNews() {
  var list = (data && data.news) || [];
  $("newslabel").textContent = (data && data.news_label) || "";
  if (!list.length) { $("nlist").innerHTML = '<li class="empty">ニュースを取得できません</li>'; return; }
  var per = 4, out = [];
  for (var i = 0; i < Math.min(per, list.length); i++) out.push(list[(newsPos + i) % list.length]);
  $("nlist").innerHTML = out.map(function (t) { return '<li class="in">' + esc(t) + '</li>'; }).join("");
}

function drawStatus() {
  var st = $("status"), msgs = [];
  if (data && data.failing && data.failing.length) msgs.push("取得失敗: " + data.failing.join("・"));
  if (Date.now() - lastOk > 5 * 60000) msgs.push("サーバーに接続できません");
  st.className = msgs.length ? "err" : "";
  st.textContent = msgs.length ? msgs.join("　") : (data ? (data.credits || "") : "");
}

function render() {
  if (!data) return;
  drawWeather(data.weather); drawIndoor(data.indoor); drawMarket(data.quotes || []);
  drawEvents(data.events); drawNews(); drawStatus();
}

// 時計の数字のフォント（config の clock.font）
var clockFontLoaded = false;
function loadClockFont(name) {
  if (clockFontLoaded || !name) return;
  clockFontLoaded = true;
  var st = document.createElement("style");
  st.textContent = '@font-face{font-family:"Clock";src:url("/fonts/' + encodeURIComponent(name) + '");font-display:swap}';
  document.head.appendChild(st);
}

function load() {
  var x = new XMLHttpRequest();
  x.open("GET", "/data.json" + (demo ? "?demo=1" : ""), true);
  x.timeout = 20000;
  x.onload = function () {
    if (x.status !== 200) return drawStatus();
    try { data = JSON.parse(x.responseText); } catch (e) { return drawStatus(); }
    if (data.now) {
      offset = new Date(data.now).getTime() - Date.now();
      var z = /([+-])(\d\d):(\d\d)$/.exec(data.now);
      tzMin = z ? (z[1] === "-" ? -1 : 1) * (+z[2] * 60 + +z[3]) : null;
    }
    lastOk = Date.now();
    loadClockFont(data.clock_font);
    render(); tick();
  };
  x.onerror = x.ontimeout = drawStatus;
  x.send();
}

tick(); load();
setInterval(tick, 1000);
setInterval(load, 60000);
setInterval(function () { if (data && data.news && data.news.length > 4) { newsPos = (newsPos + 4) % data.news.length; drawNews(); } }, 15000);
// 長時間つけっぱなしでも重くならないよう、6 時間ごとに読み込み直す
setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);
</script>
</body>
</html>
