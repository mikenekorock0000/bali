; ハイゼット ジャンボ用 ESP32 見守り装置（HIJET MONITOR）ファームウェア
;   pio run -e esp32dev            ビルド
;   pio run -e esp32dev -t upload  書き込み（USB）
;   pio test -e native             PC 上でロジックのテスト
; Arduino IDE でも書き込める（esp32_engine_starter.ino を開く。手順は README）

[platformio]
default_envs = esp32dev  ; 「Build」「Upload」は ESP32 だけを対象にする（native は PC のテスト用）

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
  h2zero/NimBLE-Arduino@1.4.3
  bblanchon/ArduinoJson@7.2.1
  adafruit/Adafruit BME280 Library@2.2.4
build_flags =
  -DCORE_DEBUG_LEVEL=1

; Wi-Fi 経由の書き込み（OTA）。ESP32 と同じ Wi-Fi にパソコンをつないでから：
;   HIJET_OTA_PASS=設定画面の OTA パスワード  pio run -e ota -t upload
; つながらないときは、ダッシュボードに出る IP アドレスを --upload-port で指定する
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = hijet-monitor.local
upload_flags =
  --auth=${sysenv.HIJET_OTA_PASS}

[env:native]
platform = native
test_build_src = no
build_src_filter = -<*>  ; PC では src/ をビルドしない（Arduino.h がない）
build_flags = -std=c++17 -I src/logic
