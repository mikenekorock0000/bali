; ハイゼット ジャンボ用 ESP32 エンジンスターター連携ファームウェア
;   pio run -e esp32dev            ビルド
;   pio run -e esp32dev -t upload  書き込み（USB）
;   pio test -e native             PC 上でロジックのテスト

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
  h2zero/NimBLE-Arduino@1.4.3
  bblanchon/ArduinoJson@7.2.1
build_flags =
  -DCORE_DEBUG_LEVEL=1

[env:native]
platform = native
test_build_src = no
build_flags = -std=c++17
