; M5Stack Dial（ESP32-S3 / StampS3・丸型 1.28 インチタッチ画面・ロータリーエンコーダー）
;
;   書き込み:   pio run -e m5dial -t upload
;   ログ表示:   pio device monitor
;   PC でテスト: pio test -e native

[platformio]
default_envs = m5dial

[env:m5dial]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Dial@1.0.3
    m5stack/M5Unified@0.2.2
    m5stack/M5GFX@0.2.3
    bblanchon/ArduinoJson@7.2.1
test_ignore = test_core

[env:native]
platform = native
build_flags = -std=c++17
lib_compat_mode = off
test_build_src = no
